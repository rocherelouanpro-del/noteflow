name: Build Windows

# Deux façons de lancer une compilation Windows :
#  1. Manuellement : onglet « Actions » de GitHub → « Build Windows » → « Run workflow ».
#     → produit les installeurs téléchargeables dans les artefacts du run (test rapide).
#  2. En publiant une version : pousser un tag « v… » (ex. v0.1.0).
#     → crée une Release GitHub avec les installeurs attachés (téléchargement public).
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # nécessaire pour créer/mettre à jour la Release lors d'un tag

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (accélère les builds suivants)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Installer les dépendances npm
        run: npm ci

      - name: Compiler l'application et les installeurs Windows
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # tagName non vide uniquement quand on pousse un tag « v… » :
          # dans ce cas une Release GitHub est créée avec les installeurs.
          # Lors d'un lancement manuel, tagName est vide → simple compilation.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: "Noteflow ${{ github.ref_name }}"
          releaseBody: "Installeurs Windows de Noteflow (fichier .exe recommandé)."
          releaseDraft: false
          prerelease: false

      # Rend les installeurs téléchargeables même sans tag (lancement manuel).
      - name: Publier les installeurs comme artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noteflow-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
