<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!-- viewport-fit=cover : la page occupe tout l'écran, encoche et Dynamic
         Island comprises (les marges de sécurité sont gérées en CSS).
         user-scalable=no : sans lui, iOS zoome tout seul dès qu'on touche un
         champ dont le texte fait moins de 16px — c'est le cas des cellules
         de tableau — et le zoom accidentel dans un éditeur de notes est
         plus gênant qu'utile. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <title>Noteflow</title>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
